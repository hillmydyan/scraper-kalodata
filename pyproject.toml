[project]
name = "kalodata-scraper-dashboard"
version = "0.1.0"
description = "Kalodata Web Scraper and Dashboard for Kurma Group"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "playwright>=1.40.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
