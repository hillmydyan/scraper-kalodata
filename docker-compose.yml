version: "3.8"

services:
  kalodata-db:
    image: postgres:15-alpine
    container_name: kalodata-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kalodata
      POSTGRES_USER: kalodata
      POSTGRES_PASSWORD: kalodata_password
    ports:
      # Bound to 127.0.0.1 port 5433 to avoid conflict with existing postgres on 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - kalodata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalodata -d kalodata"]
      interval: 10s
      timeout: 5s
      retries: 5

  kalodata-redis:
    image: redis:7-alpine
    container_name: kalodata-redis
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 port 6380 to avoid conflict with existing redis on 6379
      - "127.0.0.1:6380:6379"
    volumes:
      - kalodata_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kalodata-web:
    build: .
    container_name: kalodata-web
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8081 --workers 2 "app:create_app()"
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://kalodata:kalodata_password@kalodata-db:5432/kalodata
      - REDIS_URL=redis://kalodata-redis:6379/0
      - DISPLAY=:1
    depends_on:
      kalodata-db:
        condition: service_healthy
      kalodata-redis:
        condition: service_healthy
    volumes:
      - ./runtime:/app/runtime
      - ./config:/app/config:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro

  kalodata-beat:
    build: .
    container_name: kalodata-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://kalodata:kalodata_password@kalodata-db:5432/kalodata
      - REDIS_URL=redis://kalodata-redis:6379/0
    depends_on:
      kalodata-redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./runtime:/app/runtime

volumes:
  kalodata_pg_data:
  kalodata_redis_data:
