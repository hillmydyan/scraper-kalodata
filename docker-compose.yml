services:
  kalodata-db:
    image: postgres:15-alpine
    container_name: kalodata-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kalodata
      POSTGRES_USER: kalodata
      POSTGRES_PASSWORD: kalodata_password
    ports:
      # Port 5433 host ke 5432 container (menghindari bentrok postgres lain di host)
      - "127.0.0.1:5433:5432"
    volumes:
      - kalodata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalodata -d kalodata"]
      interval: 5s
      timeout: 3s
      retries: 5

  kalodata-redis:
    image: redis:7-alpine
    container_name: kalodata-redis
    restart: unless-stopped
    ports:
      # Port 6380 host ke 6379 container (menghindari bentrok redis lain di host)
      - "127.0.0.1:6380:6379"
    volumes:
      - kalodata_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kalodata-web:
    build: .
    container_name: kalodata-web
    restart: unless-stopped
    command: /app/deploy/docker-entrypoint-web.sh
    ports:
      # Dashboard Web dapat diakses di http://IP_VPS:8081
      - "0.0.0.0:8081:8081"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://kalodata:kalodata_password@kalodata-db:5432/kalodata
      - REDIS_URL=redis://kalodata-redis:6379/0
      - RUNTIME_DIR=/app/runtime
      - CHROME_USER_DATA_DIR=/app/runtime/chrome_profile
    depends_on:
      kalodata-db:
        condition: service_healthy
      kalodata-redis:
        condition: service_healthy
    volumes:
      - ./runtime:/app/runtime
      - ./config:/app/config:ro
      - ${CHROME_PROFILE_HOST_DIR:-/home/kurma/Service/app-scraper-affiliator-tiktok/chrome_profile_my}:/app/runtime/chrome_profile

  kalodata-worker:
    build: .
    container_name: kalodata-worker
    restart: unless-stopped
    command: /app/deploy/docker-entrypoint-worker.sh
    ports:
      # VNC Viewer connect ke IP_VPS:5902 (internal container pakai 5901)
      - "0.0.0.0:5902:5901"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://kalodata:kalodata_password@kalodata-db:5432/kalodata
      - REDIS_URL=redis://kalodata-redis:6379/0
      - RUNTIME_DIR=/app/runtime
      - KALODATA_DISPLAY=:1
      - KALODATA_HEADLESS=false
      - VNC_DISPLAY=:1
      - VNC_INTERNAL_PORT=5901
      - CHROME_USER_DATA_DIR=/app/runtime/chrome_profile
    depends_on:
      kalodata-db:
        condition: service_healthy
      kalodata-redis:
        condition: service_healthy
    volumes:
      - ./runtime:/app/runtime
      - ./config:/app/config:ro
      - ${CHROME_PROFILE_HOST_DIR:-/home/kurma/Service/app-scraper-affiliator-tiktok/chrome_profile_my}:/app/runtime/chrome_profile
    shm_size: 2gb

  kalodata-beat:
    build: .
    container_name: kalodata-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://kalodata:kalodata_password@kalodata-db:5432/kalodata
      - REDIS_URL=redis://kalodata-redis:6379/0
      - RUNTIME_DIR=/app/runtime
    depends_on:
      kalodata-redis:
        condition: service_healthy
    volumes:
      - ./runtime:/app/runtime
      - ./config:/app/config:ro

volumes:
  kalodata_pg_data:
  kalodata_redis_data:
